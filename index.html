<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クセツヨ♡ラブコメ - メルヘン本棚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="magic-dust-container"></div>

    <header class="header">
        <h1 class="site-title">
            <span class="sparkle-text">クセツヨ</span>
            <span class="heart">♡</span>
            <span class="sparkle-text">ラブコメ</span>
        </h1>
        <p class="subtitle">〜 ちょっと可笑しくて、とびきり甘い魔法の物語たち 〜</p>
    </header>

    <main class="container">
        <!-- 絞り込みタグエリア（今後用） -->
        <section class="filter-section">
            <div class="filter-group">
                <span class="filter-label">頭文字：</span>
                <div class="tags-container">
                    <button class="tag active" data-filter="all">すべて</button>
                    <button class="tag" data-filter="英数字">#英数字</button>
                    <button class="tag" data-filter="あ行">#あ行</button>
                    <button class="tag" data-filter="か行">#か行</button>
                    <button class="tag" data-filter="さ行">#さ行</button>
                    <button class="tag" data-filter="た行">#た行</button>
                    <button class="tag" data-filter="な行">#な行</button>
                    <button class="tag" data-filter="は行">#は行</button>
                    <button class="tag" data-filter="ま行">#ま行</button>
                    <button class="tag" data-filter="や行">#や行</button>
                    <button class="tag" data-filter="わ行">#わ行・他</button>
                </div>
            </div>
            <div class="filter-group genre-group">
                <span class="filter-label">ジャンル：</span>
                <div class="tags-container">
                    <button class="tag" data-filter="社会人">#社会人</button>
                    <button class="tag" data-filter="現代">#現代</button>
                    <button class="tag" data-filter="少し不思議">#少し不思議</button>
                    <button class="tag" data-filter="現代恋愛">#現代恋愛</button>
                    <button class="tag" data-filter="ほのぼの">#ほのぼの</button>
                    <button class="tag" data-filter="百合">#百合</button>
                    <button class="tag" data-filter="ホラー・ダーク">#ホラー・ダーク</button>
                    <button class="tag" data-filter="青春">#青春</button>
                    <button class="tag" data-filter="学園・青春">#学園・青春</button>
                    <button class="tag" data-filter="ラブコメ">#ラブコメ</button>
                    <button class="tag" data-filter="SF・ファンタジー">#SF・ファンタジー</button>
                    <button class="tag" data-filter="異世界">#異世界</button>
                    <button class="tag" data-filter="悪役令嬢">#悪役令嬢</button>
                    <button class="tag" data-filter="ヤンデレ・執着">#ヤンデレ・執着</button>
                    <button class="tag" data-filter="ダークロマンス">#ダークロマンス</button>
                    <button class="tag" data-filter="同居生活">#同居生活</button>
                    <button class="tag" data-filter="コメディ">#コメディ</button>
                    <button class="tag" data-filter="サイバー">#サイバー</button>
                </div>
            </div>
        </section>

        <!-- 本棚エリア -->
        <section class="bookshelf" id="bookshelf-container">
            <!-- 作品はJavaScriptによって動的に生成されます -->
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
